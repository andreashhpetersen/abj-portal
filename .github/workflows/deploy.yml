# Build and release on every push to main, gated on the same checks CI runs for
# pull requests.
#
# Required repository secrets:
#   DEPLOY_HOST         hostname or IP of the UpCloud cloud server
#   DEPLOY_USER         SSH user with permission to run docker
#   DEPLOY_SSH_KEY      private key for that user (no passphrase)
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>` — pinning the host key
#                       rather than disabling the check
#
# And one repository variable (not a secret):
#   PORTAL_DOMAIN       public hostname, e.g. portal.ab-jaeger.dk
#
# The server needs `docker login ghcr.io` done once with a token carrying
# read:packages, so it can pull this repository's image.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two releases interleave, and never cancel one halfway — a cancelled
# deploy can leave migrations applied against the previous image.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: ruff check .
        working-directory: backend
      - run: ruff format --check .
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  release:
    name: Build image and deploy
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # ghcr rejects uppercase, and repository names may contain it.
      - name: Resolve image name
        id: image
        run: |
          repo=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${repo}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "base=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          # Immutable commit tag is what the server pins to; latest is a
          # convenience for humans reading the registry.
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          # $IMAGE is expanded here, before the script is sent; everything else
          # is plain commands, so nothing else needs escaping.
          ssh -i ~/.ssh/deploy_key "$TARGET" "bash -euo pipefail -s" <<EOF
          cd /opt/abj-portal

          # Pin the release in .env so a manual 'docker compose up' on the
          # server brings up this exact build rather than a stale one. Delete
          # then append, so this works whether or not the line already exists.
          sed -i '/^PORTAL_IMAGE=/d' .env
          printf 'PORTAL_IMAGE=%s\n' "$IMAGE" >> .env
          grep -qx "PORTAL_IMAGE=$IMAGE" .env

          docker compose pull app

          # Release phase. Runs against the new image before it starts serving,
          # and a failure here aborts the deploy with the old container still up.
          docker compose run --rm app python manage.py migrate --noinput

          docker compose up -d

          # Reclaim superseded releases. Plain 'prune -f' would not: it only
          # removes dangling images, and every release is tagged by SHA, so
          # ~500MB accumulated per deploy until the disk filled. The label
          # confines this to our own images, and 'until' leaves the last three
          # days of releases in place to roll back to. The running image is in
          # use, so it is never a candidate.
          docker image prune -af \
            --filter "label=app=abj-portal" \
            --filter "until=72h"
          EOF

      # The same assertions CI ran against the container, now against the real
      # site. A green release therefore means more than "the process started".
      - name: Verify the deployment answers
        env:
          # The public domain, not DEPLOY_HOST: the certificate and Django's
          # ALLOWED_HOSTS are both bound to the name, not the address.
          DOMAIN: ${{ vars.PORTAL_DOMAIN }}
          # Generous, because the container has just been recreated.
          READY_TIMEOUT: "60"
        run: ./deploy/smoke.sh "https://${DOMAIN}"
