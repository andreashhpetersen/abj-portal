# Checks on proposed changes. Pushes to main are checked by deploy.yml instead,
# which runs the same jobs as a gate before it builds anything — so the suite
# never runs twice for the same commit.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the image runs, rather than the 3.10 floor in the README:
          # test what is actually deployed.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - run: ruff check .
        working-directory: backend

      - run: ruff format --check .
        working-directory: backend

      # pytest uses config.settings.dev, which defaults to SQLite, so no
      # database service is needed here.
      - run: pytest
        working-directory: backend

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `build` runs tsc --noEmit first, so this covers the typecheck too.
      - run: npm run build
        working-directory: frontend

  image:
    name: Image — build and smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Not pushed anywhere: this only proves the image builds and boots.
      # Shares the build cache with deploy.yml, so a release after a green
      # pull request mostly reuses these layers.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: abj-portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ALLOWED_HOSTS deliberately lists only a public-style name. Listing
      # 127.0.0.1 here too — as this once did — hides the fact that the
      # container's HEALTHCHECK talks to gunicorn on the loopback: prod.py has
      # to allow that itself, and a real deployment never lists it.
      - name: Start the container
        run: |
          docker run -d --name portal-ci -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke-test \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            -e DJANGO_SECURE_SSL_REDIRECT=False \
            abj-portal:ci

      # The container's own verdict on itself, which smoke.sh cannot give: it
      # goes through the front door, while the HEALTHCHECK goes straight to
      # gunicorn. Production ran unhealthy for a fortnight without this.
      - name: Wait for the container to report healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' portal-ci)
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          echo "container health: $status"
          docker inspect -f '{{json .State.Health}}' portal-ci
          exit 1

      # A build-only check would pass on an image that boots straight into a
      # crash loop, and would not notice the SPA fallback swallowing the API.
      # The assertions live in deploy/smoke.sh so this job, the release workflow
      # and a developer's terminal all run exactly the same ones.
      - name: Smoke-test what it serves
        run: ./deploy/smoke.sh http://127.0.0.1:8000

      - name: Container logs
        if: failure()
        run: docker logs portal-ci

      - name: Clean up
        if: always()
        run: docker rm -f portal-ci
