# Checks on proposed changes. Pushes to main are checked by deploy.yml instead,
# which runs the same jobs as a gate before it builds anything — so the suite
# never runs twice for the same commit.

name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The version the image runs, rather than the 3.10 floor in the README:
          # test what is actually deployed.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
        working-directory: backend

      - run: ruff check .
        working-directory: backend

      - run: ruff format --check .
        working-directory: backend

      # pytest uses config.settings.dev, which defaults to SQLite, so no
      # database service is needed here.
      - run: pytest
        working-directory: backend

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      # `build` runs tsc --noEmit first, so this covers the typecheck too.
      - run: npm run build
        working-directory: frontend
